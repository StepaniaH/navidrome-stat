name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify runtime lockfile installs
        run: pip install -r requirements.lock

      - name: Run tests
        run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Lint Python
        run: ruff check .

      - name: Verify installed dependencies
        run: pip check

      - name: Validate Compose config
        run: docker compose config

      - name: Check Markdown links
        run: python3 scripts/check_md_links.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker smoke test
        run: bash scripts/docker_smoke_test.sh

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install application and browser dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Build local frontend assets
        run: npm run build:assets

      - name: Run browser tests
        run: npm run test:e2e
