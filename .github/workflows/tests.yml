name: Tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Create virtualenv and install dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Check Markdown links
        run: .venv/bin/python scripts/check_md_links.py

      - name: Pytest with coverage
        run: .venv/bin/python -m pytest -q --cov=src --cov-fail-under=80 --cov-report=term-missing:skip-covered

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Node unit tests
        run: |
          npm ci
          npm run test:unit

      - name: Run stats benchmark
        id: benchmark
        if: github.event_name == 'schedule'
        run: |
          .venv/bin/python scripts/benchmark_stats.py --sizes 100000,1000000 --max-query-ms 2500 --json | tee benchmark-output.json

      - name: Upload benchmark results
        if: always() && github.event_name == 'schedule' && steps.benchmark.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-output.json
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install runtime dependencies into system Python
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
